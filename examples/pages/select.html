<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Native select</title>
  </head>
  <body>
    <h1>Native select</h1>
    <label for="size">Size</label>
    <select id="size">
      <option>Small</option>
      <option selected>Medium</option>
      <option>Large</option>
    </select>
  </body>
</html>
